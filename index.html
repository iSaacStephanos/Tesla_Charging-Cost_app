<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tesla 充電コスト＆時間シミュレーター</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 16px; display: flex; justify-content: center; }
    .card { background: #1e293b; max-width: 420px; width: 100%; border-radius: 16px; padding: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
    h1, h2 { text-align: center; color: #38bdf8; margin-top: 0; }
    h1 { font-size: 1.25rem; margin-bottom: 20px; }
    h2 { font-size: 1rem; margin: 24px 0 12px; border-bottom: 1px solid #334155; padding-bottom: 8px; }
    .form-group { margin-bottom: 14px; }
    label { display: block; font-size: 0.85rem; color: #94a3b8; margin-bottom: 6px; }
    input, select { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: #fff; font-size: 1rem; box-sizing: border-box; }
    .result-box { margin-top: 18px; padding: 16px; border-radius: 12px; background: #0f172a; border: 1px solid #334155; }
    .stat-row { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; font-size: 0.95rem; }
    .stat-row:last-child { margin-bottom: 0; }
    .highlight { font-size: 1.3rem; font-weight: bold; color: #38bdf8; }
    .highlight-green { font-size: 1.3rem; font-weight: bold; color: #4ade80; }
    .warning { color: #f87171; }
    .btn-group { display: flex; gap: 8px; margin-top: 16px; }
    button { flex: 1; padding: 12px 4px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; color: #fff; font-size: 0.85rem; }
    .btn-success { background: #059669; }
    .btn-ev { background: #ca8a04; }
    .btn-ice { background: #dc2626; }
    
    /* 履歴と統計用のスタイル追加 */
    .summary-box { background: #0f172a; border: 1px dashed #38bdf8; border-radius: 8px; padding: 12px; margin-bottom: 16px; text-align: center; font-size: 0.9rem; }
    .log-list { list-style: none; padding: 0; margin: 0; max-height: 250px; overflow-y: auto; font-size: 0.85rem; }
    .log-item { background: #0f172a; padding: 10px; margin-bottom: 8px; border-radius: 8px; display: flex; justify-content: space-between; border-left: 4px solid transparent; align-items: center;}
    .log-success { border-left-color: #059669; }
    .log-ev { border-left-color: #ca8a04; }
    .log-ice { border-left-color: #dc2626; }
    .log-time { color: #94a3b8; font-size: 0.75rem; text-align: right; min-width: 80px;}
    .log-details { font-size: 0.75rem; color: #cbd5e1; margin-top: 4px; }
  </style>
</head>
<body>

<div class="card">
  <h1>Tesla 充電シミュレーター</h1>
  
  <div class="form-group">
    <label>現在のバッテリー残量 (%)</label>
    <input type="number" id="currentSoc" value="47" min="0" max="100">
  </div>
  <div class="form-group">
    <label>目標の充電上限 (%)</label>
    <input type="number" id="targetSoc" value="80" min="0" max="100">
  </div>
  <div class="form-group">
    <label>充電出力</label>
    <select id="power">
      <option value="3.0">3.0 kW (一般的な200Vコンセント)</option>
      <option value="9.6">9.6 kW (モデル3受電上限 / 高出力)</option>
    </select>
  </div>
  <div class="form-group">
    <label>駐車料金 (円)</label>
    <input type="number" id="cost" value="500" min="0">
  </div>

  <div class="result-box">
    <div class="stat-row">
      <span>予想充電時間</span>
      <span class="highlight" id="duration">- 時間 - 分</span>
    </div>
    <div class="stat-row">
      <span>充電電力量</span>
      <span id="chargeKwh">- kWh</span>
    </div>
    <div class="stat-row">
      <span>実質単価</span>
      <span class="highlight-green" id="unitPrice">- 円/kWh</span>
    </div>
    <div class="stat-row">
      <span>SC比の差額</span>
      <span id="scComparison" style="font-weight: bold;">- 円</span>
    </div>
  </div>

  <h2>現地の状況を記録</h2>
  <div class="btn-group">
    <button class="btn-success" onclick="saveLog('充電開始', 'log-success')">🟢 充電開始</button>
    <button class="btn-ev" onclick="saveLog('先約あり', 'log-ev')">🟡 先約あり</button>
    <button class="btn-ice" onclick="saveLog('一般車', 'log-ice')">🔴 一般車</button>
  </div>

  <h2>訪問履歴 ＆ トータル実績</h2>
  
  <div class="summary-box" id="totalStats">
    <!-- ここに平均値と累計が自動計算されて入ります -->
  </div>

  <ul class="log-list" id="logList"></ul>
</div>

<script>
  const CAPACITY = 79.0;
  const EFFICIENCY = 0.90;
  const SC_RATE = 50.0;
  let logs = JSON.parse(localStorage.getItem('tesla_logs_v2')) || [];

  function calculate() {
    const current = parseFloat(document.getElementById('currentSoc').value) || 0;
    const target = parseFloat(document.getElementById('targetSoc').value) || 0;
    const fee = parseFloat(document.getElementById('cost').value) || 0;
    const power = parseFloat(document.getElementById('power').value) || 3.0;

    const diffSoc = Math.max(0, target - current);
    const kwh = CAPACITY * (diffSoc / 100);
    const effectivePower = power * EFFICIENCY;
    const hours = kwh > 0 ? (kwh / effectivePower) : 0;
    const unitPrice = kwh > 0 ? (fee / kwh) : 0;
    const saving = (kwh * SC_RATE) - fee;

    const h = Math.floor(hours);
    const m = Math.round((hours - h) * 60);
    document.getElementById('duration').innerText = kwh > 0 ? `約 ${h}時間 ${m}分` : '0分';
    document.getElementById('chargeKwh').innerText = `${kwh.toFixed(1)} kWh (+${diffSoc}%)`;
    document.getElementById('unitPrice').innerText = `${unitPrice.toFixed(1)} 円/kWh`;

    const scCompEl = document.getElementById('scComparison');
    if (kwh === 0) {
      scCompEl.innerText = '0 円';
      scCompEl.className = '';
    } else if (saving >= 0) {
      scCompEl.innerText = `SCより ${Math.round(saving).toLocaleString()}円 お得`;
      scCompEl.className = ''; scCompEl.style.color = '#4ade80';
    } else {
      scCompEl.innerText = `SCより ${Math.round(Math.abs(saving)).toLocaleString()}円 割高`;
      scCompEl.className = 'warning';
    }
    
    return { fee, kwh, unitPrice };
  }

  function saveLog(status, typeClass) {
    const now = new Date();
    const days = ['日', '月', '火', '水', '木', '金', '土'];
    const dayOfWeek = days[now.getDay()];
    const timeStr = `${now.getMonth()+1}/${now.getDate()}(${dayOfWeek}) ${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}`;
    
    // 現在の計算結果（料金、電力量、単価）を取得
    const currentCalc = calculate();
    
    logs.unshift({ 
      time: timeStr, 
      status: status, 
      type: typeClass,
      fee: currentCalc.fee,
      kwh: currentCalc.kwh,
      unitPrice: currentCalc.unitPrice
    });
    
    if(logs.length > 50) logs.pop(); // 最新50件まで保存
    localStorage.setItem('tesla_logs_v2', JSON.stringify(logs));
    renderLogs();
  }

  function renderLogs() {
    const list = document.getElementById('logList');
    list.innerHTML = '';
    
    let totalFee = 0;
    let totalKwh = 0;
    let chargeCount = 0;

    logs.forEach(log => {
      // 履歴リストの描画
      let detailsHtml = '';
      if (log.status === '充電開始' && log.fee !== undefined) {
        detailsHtml = `<div class="log-details">${log.fee.toLocaleString()}円 / ${log.unitPrice.toFixed(1)} 円/kWh</div>`;
        totalFee += log.fee;
        totalKwh += log.kwh;
        chargeCount++;
      }

      list.innerHTML += `<li class="log-item ${log.type}">
        <div>
          <span style="font-weight: bold;">${log.status}</span>
          ${detailsHtml}
        </div>
        <span class="log-time">${log.time}</span>
      </li>`;
    });

    // 平均値・トータルの計算と描画
    const statsBox = document.getElementById('totalStats');
    if (chargeCount > 0) {
      const avgUnitPrice = totalKwh > 0 ? (totalFee / totalKwh) : 0;
      statsBox.innerHTML = `
        <div style="margin-bottom: 8px; color: #94a3b8;">累計 ${chargeCount}回 / ${totalFee.toLocaleString()}円</div>
        <div>トータル平均単価: <span class="highlight-green">${avgUnitPrice.toFixed(1)} 円/kWh</span></div>
      `;
    } else {
      statsBox.innerHTML = '<div style="color: #94a3b8;">まだ充電の実績記録がありません</div>';
    }
  }

  document.querySelectorAll('input, select').forEach(el => el.addEventListener('input', calculate));
  calculate();
  renderLogs();
</script>
</body>
</html>
